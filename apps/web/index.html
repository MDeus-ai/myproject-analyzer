<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MyProject Analyzer</title>
    <meta
      name="description"
      content="MyProject Analyzer - Desktop tool to strip inner subfolders into flat files, visualize project hierarchy trees, export structure PDFs and high-res images, and analyze codefiles with location and type metadata."
    />
    <meta property="og:title" content="MyProject Analyzer" />
    <meta
      property="og:description"
      content="MyProject Analyzer - Desktop tool to strip inner subfolders into flat files, visualize project hierarchy trees, export structure PDFs and high-res images, and analyze codefiles with location and type metadata."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Content Security Policy is injected at build/serve time by
    vite.config.ts (strict for production, relaxed for the dev server).
     Do not add a static CSP meta tag here — it would conflict. -->

    <!-- Mobile browser chrome color (matches --app-bg for each appearance) -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0e1013"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#eef1f6"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
