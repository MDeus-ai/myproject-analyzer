[package]
name = "myproject-rust-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust engine for MyProject Analyzer (DepLenz AST/graph builder, SIMD codebase search, token estimator, and parallel walker)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
napi-binding = ["dep:napi", "dep:napi-derive"]
wasm-binding = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
parallel-walk = ["dep:ignore", "dep:rayon"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
memchr = "2.7"
rayon = { version = "1.10", optional = true }
ignore = { version = "0.4", optional = true }
napi = { version = "2.16", default-features = false, features = ["napi4", "serde-json"], optional = true }
napi-derive = { version = "2.16", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[build-dependencies]
napi-build = { version = "2.1", optional = true }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
